<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        var hash = path ? "#" + path.toLowerCase() : "";
        var target = window.location.origin + "/" + hash + window.location.search;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
